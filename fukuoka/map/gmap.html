<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍜 벳푸·후쿠오카 구글 지도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f0f4f8; color: #2d3748; }
  .header { background: linear-gradient(135deg, #1e3a5f, #2563eb); color: white; padding: 14px 16px 12px; }
  .header h1 { font-size: 16px; font-weight: 800; }
  .header p { font-size: 12px; opacity: .85; margin-top: 2px; }
  .back { display: inline-block; color: white; opacity: .9; font-size: 12px; font-weight: 700; text-decoration: none; margin-bottom: 6px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 5; }
  .tab { flex: 0 0 auto; border: 1px solid #cbd5e1; background: white; color: #475569; font-size: 12.5px; font-weight: 800; border-radius: 20px; padding: 6px 13px; cursor: pointer; font-family: inherit; }
  .tab.on { color: white; border-color: transparent; background: var(--c, #1e3a5f); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }
  .mapbox { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  .mapbox iframe { display: block; width: 100%; height: 58vh; min-height: 320px; border: 0; }
  .mapbar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
  .mapbar .cur { flex: 1 1 160px; font-size: 12.5px; font-weight: 700; color: #1e293b; }
  .mapbar a, .mapbar button { font-size: 12px; font-weight: 800; color: #1d4ed8; background: #eff6ff; border: 0; border-radius: 20px; padding: 6px 12px; text-decoration: none; cursor: pointer; font-family: inherit; }
  .list { margin-top: 12px; }
  .place { display: flex; gap: 10px; background: white; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.06); cursor: pointer; border: 2px solid transparent; }
  .place.sel { border-color: var(--c, #1e3a5f); }
  .num { flex: 0 0 26px; height: 26px; border-radius: 50%; color: white; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: var(--c, #64748b); }
  .pname { font-size: 14px; font-weight: 800; color: #1e293b; }
  .pname small { font-size: 11px; font-weight: 600; color: #94a3b8; margin-left: 6px; }
  .pdesc { font-size: 12px; color: #64748b; line-height: 1.55; margin-top: 3px; }
  .ptip { font-size: 11.5px; color: #92400e; background: #fffbeb; border-radius: 6px; padding: 4px 8px; margin-top: 5px; line-height: 1.5; }
  .foot { text-align: center; font-size: 11.5px; color: #94a3b8; padding: 14px 8px 24px; line-height: 1.7; }
  .foot a { color: #64748b; }
</style>
<link rel="icon" type="image/png" href="/trip-plan/icons/icon-192-v2.png">
<link rel="manifest" href="/trip-plan/manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="/trip-plan/icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="💕수아네 가족여행💕">
</head>
<body>
<div class="header">
  <a class="back" href="../fukuoka_family_trip.html">← 일정표로</a>
  <h1><a href="https://asakasimo1.github.io/trip-plan/" title="여행 목록(메인)으로" style="color:inherit;text-decoration:none">🍜 벳푸·후쿠오카 구글 지도</a></h1>
  <p>11/29 – 12/4 · 처음엔 전체 지도 · 날짜 탭 → 그날 장소 · 장소를 누르면 그 위치로 이동</p>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="mapbox">
    <iframe id="frame" title="구글 지도" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    <div class="mapbar">
      <div class="cur" id="cur"></div>
      <a id="routeBtn" href="#" target="_blank" rel="noopener">🛣️ 하루 동선(구글맵)</a>
      <a id="openApp" href="#" target="_blank" rel="noopener">구글맵 앱으로 열기</a>
      <a href="https://www.google.com/maps/d/viewer?mid=15WOosCb-NuJpVjpzObgiSXqQoXHo4g8&hl=ko" target="_blank" rel="noopener">📌 내 지도 크게 보기</a>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">지도는 구글 지도(한국어)입니다. 마커 위치는 장소명 검색 기준이에요.<br>
    <a href="map.html">전체 마커 한눈에 보기(OSM 지도)</a></div>
</div>
<script src="locations.js"></script>
<script>
(function () {
  var REGION = function (l) { return l.id === 'oita_airport' ? '大分県' : (l.lat < 33.45 && l.lng > 131 ? '大分県別府市' : '福岡県福岡市'); };
  var Q = function (l) { var b = l.mapQuery || l.nameJp; return /福岡|別府|大分/.test(b) ? b : b + ' ' + REGION(l); };
  var enc = encodeURIComponent;
  var frame = document.getElementById('frame'), cur = document.getElementById('cur');
  var MID = '15WOosCb-NuJpVjpzObgiSXqQoXHo4g8';   // 공유한 구글 내 지도(My Maps): 전체 마커·날짜별 색
  var day = 0, selId = null;
  var color = function (d) { return d === 0 ? '#1e3a5f' : DAY_COLORS[d].color; };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function dayItems(d) {
    if (d === 0) return LOCATIONS.slice().sort(function (a, b) { return (a.day - b.day) || ((a.order || 99) - (b.order || 99)); });
    return LOCATIONS.filter(function (l) { return l.day === d; })
      .sort(function (a, b) { return (a.order || 99) - (b.order || 99); });
  }
  function routeStops(d) { return dayItems(d).filter(function (l) { return l.order > 0; }); }
  function showPlace(l) {
    selId = l.id;
    frame.src = 'https://www.google.com/maps?q=' + enc(Q(l)) + '&hl=ko&z=15&output=embed';
    cur.textContent = '📍 ' + l.name;
    document.getElementById('openApp').href = 'https://www.google.com/maps/search/?api=1&query=' + enc(Q(l));
    mark();
  }
  function showOverview() {
    selId = null;
    frame.src = 'https://www.google.com/maps/d/embed?mid=' + MID + '&hl=ko';
    cur.textContent = '🗺️ 전체 한눈에 — 날짜별 색 마커';
    document.getElementById('openApp').href = 'https://www.google.com/maps/d/viewer?mid=' + MID + '&hl=ko';
    document.getElementById('routeBtn').style.display = 'none';
    mark();
  }
  function setRouteLink() {
    var s = routeStops(day), rb = document.getElementById('routeBtn');
    if (s.length >= 2) { rb.href = 'https://www.google.com/maps/dir/' + s.map(function (l) { return enc(Q(l)); }).join('/') + '/?hl=ko'; rb.style.display = ''; }
    else rb.style.display = 'none';
  }
  function showFirst() {
    if (day === 0) { showOverview(); return; }
    setRouteLink();
    var it = dayItems(day); if (it[0]) showPlace(it[0]);
  }
  function mark() {
    document.querySelectorAll('.place').forEach(function (p) { p.classList.toggle('sel', p.getAttribute('data-id') === selId); });
  }
  function renderList() {
    var list = document.getElementById('list'); list.textContent = '';
    var c = color(day); list.style.setProperty('--c', c);
    dayItems(day).forEach(function (l) {
      var p = el('div', 'place'); p.setAttribute('data-id', l.id); p.style.setProperty('--c', day === 0 ? DAY_COLORS[l.day].color : c);
      p.appendChild(el('div', 'num', day === 0 ? (l.day === 7 ? '🍽' : String(l.day)) : (l.order > 0 ? String(l.order) : '·')));
      var b = el('div'); var n = el('div', 'pname', l.name); n.appendChild(el('small', '', l.nameJp)); b.appendChild(n);
      if (l.desc) b.appendChild(el('div', 'pdesc', l.desc));
      if (l.tip) b.appendChild(el('div', 'ptip', '💡 ' + l.tip));
      p.appendChild(b);
      p.addEventListener('click', function () {
        if (day === 0) { day = l.day; renderTabs(); renderList(); setRouteLink(); }
        showPlace(l); window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      list.appendChild(p);
    });
  }
  function renderTabs() {
    var t = document.getElementById('tabs'); t.textContent = '';
    var names = { 0: '🗺️ 전체', 1: 'D1 · 11/29', 2: 'D2 · 11/30', 3: 'D3 · 12/1', 4: 'D4 · 12/2', 5: 'D5 · 12/3', 6: 'D6 · 12/4', 7: '🍽️ 맛집후보' };
    Object.keys(names).forEach(function (k) {
      var b = el('button', 'tab' + (+k === day ? ' on' : ''), names[k]); b.type = 'button';
      b.style.setProperty('--c', color(+k));
      b.addEventListener('click', function () { day = +k; renderTabs(); renderList(); showFirst(); });
      t.appendChild(b);
    });
  }
  var m = location.hash.match(/day=(\d)/); if (m && (+m[1] === 0 || DAY_COLORS[m[1]])) day = +m[1];
  renderTabs(); renderList(); showFirst();
})();
</script>
<script>if ('serviceWorker' in navigator) { addEventListener('load', function () { navigator.serviceWorker.register('/trip-plan/sw.js', { scope: '/trip-plan/' }).catch(function () {}); }); }</script>
</body>
</html>
